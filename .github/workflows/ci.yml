name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpp:
    name: C++ core (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Smoke-test the CLI
        run: ./build/qp_price --forward 3577 --days 9 --rate 0.03 --strikes 3300,3577,3700 --states 3

  python:
    name: Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build extension and install
        run: uv sync
      - name: Lint
        run: uv run ruff check python tests
      - name: Test
        run: uv run pytest -q
